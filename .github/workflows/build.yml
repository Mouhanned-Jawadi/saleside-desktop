name: Build Desktop App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist
            artifact-path: "release/*.exe"
          - os: macos-14
            script: dist:mac
            artifact-path: "release/*.dmg"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout desktop app
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Mohanad-Ahmed-ETG/SaleSide-Front-2.0
          token: ${{ secrets.GH_TOKEN }}
          path: frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Copy frontend dist into desktop app
        shell: bash
        run: cp -r frontend/dist/. dist/

      - name: Install desktop dependencies
        run: npm ci

      - name: Import signing certificate (macOS only)
        if: matrix.os == 'macos-14'
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "temp_password" build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp_password" build.keychain
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "temp_password" build.keychain
          rm certificate.p12

      - name: Build Windows
        if: matrix.os == 'windows-latest'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Build, sign, and notarize macOS
        if: matrix.os == 'macos-14'
        timeout-minutes: 60
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: true
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" ${{ matrix.artifact-path }} --clobber --repo Mouhanned-Jawadi/saleside-desktop
