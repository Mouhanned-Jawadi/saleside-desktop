name: Build Desktop App

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_mas:
        description: 'Build & upload the Mac App Store (.pkg) build to App Store Connect'
        type: boolean
        default: false

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout desktop app
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Mohanad-Ahmed-ETG/SaleSide-Front-2.0
          token: ${{ secrets.GH_TOKEN }}
          path: frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Copy frontend dist into desktop app
        shell: bash
        run: cp -r frontend/dist/. dist/

      - name: Install desktop dependencies
        run: npm ci

      - name: Build Windows
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist -- --publish never

      - name: Upload Windows artifacts to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" release/*.exe --clobber --repo Mouhanned-Jawadi/saleside-desktop

  build-mac-app:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout desktop app
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Mohanad-Ahmed-ETG/SaleSide-Front-2.0
          token: ${{ secrets.GH_TOKEN }}
          path: frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Copy frontend dist into desktop app
        shell: bash
        run: cp -r frontend/dist/. dist/

      - name: Install desktop dependencies
        run: npm ci

      - name: Import signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "temp_password" build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychains -s build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temp_password" build.keychain
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "temp_password" build.keychain
          rm certificate.p12

      - name: Build and sign macOS .app (arm64 + x64, no notarize, no DMG)
        env:
          SKIP_NOTARIZE: "1"
          CI: "true"
        run: npx electron-builder --mac --dir --arm64 --x64 --publish never

      - name: Archive signed .app for handoff
        shell: bash
        run: |
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent \
            "release/mac-arm64/SaleSide.app" \
            "artifact/SaleSide.app.zip"
          ls -la artifact/

      - name: Upload signed .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: saleside-mac-app-signed
          path: artifact/SaleSide.app.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload signed .app to GitHub Release (pre-notarize safety net)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp "artifact/SaleSide.app.zip" "artifact/SaleSide-${VERSION}-arm64.app.zip"
          gh release upload "v${VERSION}" "artifact/SaleSide-${VERSION}-arm64.app.zip" \
            --clobber --repo Mouhanned-Jawadi/saleside-desktop

      - name: Archive + upload signed x64 .app to GitHub Release (pre-notarize safety net)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ditto -c -k --sequesterRsrc --keepParent \
            "release/mac/SaleSide.app" \
            "artifact/SaleSide-${VERSION}-x64.app.zip"
          gh release upload "v${VERSION}" "artifact/SaleSide-${VERSION}-x64.app.zip" \
            --clobber --repo Mouhanned-Jawadi/saleside-desktop

      - name: Package signed arm64 .app into DMG (no notarize)
        env:
          SKIP_NOTARIZE: "1"
          CI: "true"
        run: npx electron-builder --mac --arm64 --prepackaged "release/mac-arm64/SaleSide.app" --publish never

      - name: Package signed x64 .app into DMG (no notarize)
        env:
          SKIP_NOTARIZE: "1"
          CI: "true"
        run: npx electron-builder --mac --x64 --prepackaged "release/mac/SaleSide.app" --publish never

      - name: Upload signed DMG to GitHub Release (pre-notarize safety net)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" release/*.dmg --clobber --repo Mouhanned-Jawadi/saleside-desktop

  notarize-and-package:
    needs: build-mac-app
    runs-on: macos-14
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - name: Checkout desktop app
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install desktop dependencies
        run: npm ci

      - name: Download signed .app artifact
        uses: actions/download-artifact@v4
        with:
          name: saleside-mac-app-signed
          path: artifact

      - name: Extract .app into release/mac-arm64
        shell: bash
        run: |
          mkdir -p release/mac-arm64
          ditto -x -k artifact/SaleSide.app.zip release/mac-arm64/
          ls -la release/mac-arm64/

      - name: Notarize and staple .app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CI: "true"
        run: node notarize.js "release/mac-arm64/SaleSide.app"

      - name: Re-upload notarized .app to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p artifact
          ditto -c -k --sequesterRsrc --keepParent \
            "release/mac-arm64/SaleSide.app" \
            "artifact/SaleSide-${VERSION}-arm64.app.zip"
          gh release upload "v${VERSION}" "artifact/SaleSide-${VERSION}-arm64.app.zip" \
            --clobber --repo Mouhanned-Jawadi/saleside-desktop

      - name: Package stapled .app into DMG
        env:
          SKIP_NOTARIZE: "1"
          CI: "true"
        run: npx electron-builder --mac --arm64 --prepackaged "release/mac-arm64/SaleSide.app" --publish never

      - name: Upload macOS DMG to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "v${VERSION}" release/*.dmg --clobber --repo Mouhanned-Jawadi/saleside-desktop

  # ---------------------------------------------------------------------------
  # Mac App Store (MAS) build — SEPARATE, SANDBOXED pipeline.
  # NOT notarized (App Review replaces notarization). Produces a signed .pkg and
  # uploads it to App Store Connect. Runs ONLY when manually dispatched with
  # build_mas=true, so it never fires on normal push/tag builds during the spike.
  #
  # This is a FEASIBILITY SPIKE: the Recall native SDK, the local Express server,
  # and system/screen-audio capture may not work under App Sandbox. Confirm
  # behavior via macOS TestFlight before any real App Store submission.
  # ---------------------------------------------------------------------------
  build-mac-mas:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_mas }}
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout desktop app
        uses: actions/checkout@v4

      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: Mohanad-Ahmed-ETG/SaleSide-Front-2.0
          token: ${{ secrets.GH_TOKEN }}
          path: frontend

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Copy frontend dist into desktop app
        shell: bash
        run: cp -r frontend/dist/. dist/

      - name: Install desktop dependencies
        run: npm ci

      - name: Import MAS signing certificates
        env:
          MAS_CERTIFICATE_P12: ${{ secrets.MAS_CERTIFICATE_P12 }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
        run: |
          echo "$MAS_CERTIFICATE_P12" | base64 --decode > mas_certificate.p12
          security create-keychain -p "temp_password" mas.keychain
          security import mas_certificate.p12 \
            -k mas.keychain \
            -P "$MAS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security list-keychains -s mas.keychain
          security default-keychain -s mas.keychain
          security unlock-keychain -p "temp_password" mas.keychain
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "temp_password" mas.keychain
          rm mas_certificate.p12

      - name: Install App Store provisioning profile
        env:
          MAS_PROVISIONING_PROFILE_BASE64: ${{ secrets.MAS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          echo "$MAS_PROVISIONING_PROFILE_BASE64" | base64 --decode > build/embedded.provisionprofile

      - name: Build MAS .pkg (sandboxed, no notarize)
        env:
          SKIP_NOTARIZE: "1"
          CI: "true"
        run: npx electron-builder --mac mas --publish never

      - name: Upload .pkg to App Store Connect
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          PKG=$(ls release/*.pkg | head -n1)
          echo "Uploading $PKG"
          # altool reads the private key from ./private_keys/AuthKey_<KEYID>.p8
          mkdir -p ./private_keys
          echo "$ASC_API_KEY_P8" | base64 --decode > "./private_keys/AuthKey_${ASC_API_KEY_ID}.p8"
          xcrun altool --upload-app \
            --type macos \
            --file "$PKG" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID"
          rm -rf ./private_keys

      - name: Upload MAS .pkg as CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: saleside-mac-mas-pkg
          path: release/*.pkg
          retention-days: 7
          if-no-files-found: error
